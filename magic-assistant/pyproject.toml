[project]
name = "magic-assistant"
version = "0.1.0"
description = "Deterministic Magic rules retrieval and card data access"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "numpy==2.5.2",
    "pydantic>=2.12.5,<3",
    "pymupdf>=1.26.7,<2",
    "rank-bm25>=0.2.2",
    "sentence-transformers==6.0.0",
    "truststore==0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.14.10,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
